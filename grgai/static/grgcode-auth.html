<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Grg Code</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0e0b17; color: #ece9f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
        .card { max-width: 420px; width: 100%; text-align: center; background: #15111f; border: 1px solid #241d38; border-radius: 18px; padding: 36px 28px; }
        .logo { font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin-bottom: 6px; }
        .logo .dot { color: #8b5cf6; }
        .logo .tag { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #a78bfa; background: rgba(139,92,246,.14); border: 1px solid rgba(139,92,246,.3); padding: 2px 6px; border-radius: 5px; margin-left: 7px; vertical-align: middle; }
        .sub { color: #9990b3; font-size: 13.5px; margin: 10px 0 22px; line-height: 1.6; }
        #status { font-size: 14px; color: #ece9f6; margin-bottom: 18px; min-height: 22px; }
        .spin { width: 22px; height: 22px; border: 3px solid rgba(139,92,246,.3); border-top-color: #8b5cf6; border-radius: 50%; animation: rot .8s linear infinite; margin: 0 auto 16px; }
        @keyframes rot { to { transform: rotate(360deg); } }
        .btn { display: inline-flex; align-items: center; gap: 9px; background: #fff; color: #1f2328; border: 0; border-radius: 10px; padding: 11px 18px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .btn:hover { opacity: .92; }
        .hint { color: #645a7c; font-size: 12px; margin-top: 18px; line-height: 1.6; }
        .err { color: #fca5a5; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">Grg<span class="dot">.</span>AI<span class="tag">Code</span></div>
        <div class="sub">Sign in with Google to connect your Grg AI account to the Grg Code desktop app.</div>
        <div class="spin" id="spin"></div>
        <div id="status">Opening Google sign-in…</div>
        <button class="btn" id="go" style="display:none" onclick="go()">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Continue with Google
        </button>
        <div class="hint" id="hint">A Google window will open. After you approve, this tab sends you back to Grg Code automatically.</div>
    </div>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
        const firebaseConfig = {
            apiKey: "AIzaSyB5UAUcnxlp6O1mjCWrx6NdxF3TLtksJ_A",
            authDomain: "grg-ai.firebaseapp.com",
            projectId: "grg-ai",
            storageBucket: "grg-ai.firebasestorage.app",
            messagingSenderId: "16673046504",
            appId: "1:16673046504:web:593219b6b3b4fba14f2e5d"
        };
        const auth = getAuth(initializeApp(firebaseConfig));
        const q = new URLSearchParams(location.search);
        const port = q.get('port'), state = q.get('state') || '';
        const statusEl = document.getElementById('status');
        const spin = document.getElementById('spin');
        const goBtn = document.getElementById('go');
        function fail(msg) { spin.style.display = 'none'; statusEl.className = 'err'; statusEl.textContent = msg; goBtn.style.display = 'inline-flex'; try { goBtn.lastChild.textContent = ' Try again'; } catch (e) {} }
        window.go = async function () {
            goBtn.style.display = 'none'; spin.style.display = 'block'; statusEl.className = ''; statusEl.textContent = 'Opening Google sign-in…';
            if (!port) { fail('Missing callback port — reopen sign-in from Grg Code.'); return; }
            try {
                const res = await signInWithPopup(auth, new GoogleAuthProvider());
                statusEl.textContent = 'Finishing…';
                const idToken = await res.user.getIdToken();
                const r = await fetch('/api/grgcode/auth-exchange', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idToken }) });
                const j = await r.json();
                if (!j.customToken) throw new Error(j.error || 'exchange failed');
                statusEl.textContent = 'Signed in — returning to Grg Code…';
                location.href = 'http://127.0.0.1:' + port + '/cb?token=' + encodeURIComponent(j.customToken) + '&state=' + encodeURIComponent(state);
            } catch (e) {
                fail('Sign-in failed: ' + String((e && e.message) || e).replace('Firebase:', '').trim());
            }
        };
        go();
    </script>
</body>
</html>
