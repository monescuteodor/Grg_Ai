<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared chat · Grg AI</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Shared chat · Grg AI">
<meta property="og:description" content="A conversation shared from Grg AI.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<style>
  :root{
    --bg:#0e0e16; --panel:#15151f; --panel2:#1b1b27; --line:#2a2a3a;
    --text:#e7e7ef; --mute:#9a9ab0; --purple:#8b5cf6; --green:#10b981;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.65;}
  a{color:var(--purple)}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px 80px;}
  header{position:sticky;top:0;z-index:5;background:rgba(14,14,22,.82);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:14px 20px;margin:0 -20px 24px;}
  .brand{font-weight:800;font-size:18px;letter-spacing:-.02em}
  .brand .dot{color:var(--purple)}
  .cta{margin-left:auto;background:linear-gradient(135deg,var(--purple),#6d28d9);
    color:#fff;text-decoration:none;font-weight:600;font-size:13px;
    padding:8px 14px;border-radius:9px;white-space:nowrap}
  .cta:hover{filter:brightness(1.08)}
  h1.title{font-size:22px;margin:8px 0 4px;letter-spacing:-.02em}
  .meta{color:var(--mute);font-size:13px;margin-bottom:28px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .badge{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
    padding:3px 10px;font-size:12px;color:var(--mute)}
  .turn{margin-bottom:22px}
  .role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:7px;display:flex;align-items:center;gap:7px}
  .role.user{color:var(--purple)}
  .role.ai{color:var(--green)}
  .role .av{width:18px;height:18px;border-radius:5px;display:inline-block}
  .role.user .av{background:linear-gradient(135deg,var(--purple),#6d28d9)}
  .role.ai .av{background:linear-gradient(135deg,var(--green),#059669)}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;font-size:15px;overflow-wrap:anywhere}
  .bubble.user{background:var(--panel2)}
  .bubble>:first-child{margin-top:0}
  .bubble>:last-child{margin-bottom:0}
  .bubble p{margin:.6em 0}
  .bubble pre{background:#0b0b12;border:1px solid var(--line);border-radius:9px;
    padding:12px 14px;overflow-x:auto;font-size:13px}
  .bubble code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.92em}
  .bubble :not(pre)>code{background:#0b0b12;border:1px solid var(--line);
    padding:1px 6px;border-radius:5px}
  .bubble img{max-width:100%;border-radius:10px;border:1px solid var(--line)}
  .bubble table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:14px}
  .bubble th,.bubble td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  .bubble blockquote{border-left:3px solid var(--purple);margin:.6em 0;padding:2px 14px;color:var(--mute)}
  .state{text-align:center;color:var(--mute);padding:80px 20px;font-size:15px}
  footer{text-align:center;color:var(--mute);font-size:13px;margin-top:40px;
    border-top:1px solid var(--line);padding-top:24px}
  footer a{color:var(--mute)}
</style>
</head>
<body>
<header>
  <span class="brand">Grg<span class="dot">.</span>AI</span>
  <a class="cta" href="/">Try Grg AI free →</a>
</header>
<div class="wrap">
  <div id="content"><div class="state">Loading shared chat…</div></div>
  <footer>
    This conversation was shared from <a href="/">Grg AI</a> · read-only ·
    <a href="/">start your own</a>
  </footer>
</div>
<script>
(function () {
  try { marked.setOptions({ breaks: true, gfm: true }); } catch (e) {}
  var id = (location.pathname.split('/').filter(Boolean).pop() || '').trim();
  var box = document.getElementById('content');
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function md(src){
    try { return DOMPurify.sanitize(marked.parse(src || '')); }
    catch (e) { return '<p>' + esc(src) + '</p>'; }
  }
  function render(doc){
    document.title = (doc.title || 'Shared chat') + ' · Grg AI';
    var html = '<h1 class="title">' + esc(doc.title || 'Shared chat') + '</h1>';
    html += '<div class="meta">';
    if (doc.model) html += '<span class="badge">' + esc(doc.model) + '</span>';
    if (doc.ts) html += '<span>' + new Date(doc.ts * 1000).toLocaleDateString() + '</span>';
    html += '<span>' + (doc.turns ? doc.turns.length : 0) + ' message' + ((doc.turns && doc.turns.length === 1) ? '' : 's') + '</span>';
    html += '</div>';
    (doc.turns || []).forEach(function (t) {
      html += '<div class="turn">';
      if (t.user) {
        html += '<div class="role user"><span class="av"></span>You</div>'
             +  '<div class="bubble user">' + md(t.user) + '</div>';
      }
      html += '<div class="turn"></div>';
      if (t.image) {
        html += '<div class="role ai"><span class="av"></span>Grg AI</div>'
             +  '<div class="bubble"><img src="' + esc(t.image) + '" alt="generated image"></div>';
      } else if (t.assistant) {
        html += '<div class="role ai"><span class="av"></span>Grg AI</div>'
             +  '<div class="bubble">' + md(t.assistant) + '</div>';
      }
      html += '</div>';
    });
    box.innerHTML = html;
    try { box.querySelectorAll('pre code').forEach(function (c) { hljs.highlightElement(c); }); } catch (e) {}
  }
  if (!/^[A-Za-z0-9_-]{6,24}$/.test(id)) {
    box.innerHTML = '<div class="state">This link looks invalid.</div>'; return;
  }
  fetch('/api/share/' + encodeURIComponent(id))
    .then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(render)
    .catch(function () {
      box.innerHTML = '<div class="state">This shared chat was not found or has expired.<br><br>'
        + '<a class="cta" href="/">Open Grg AI</a></div>';
    });
})();
</script>
</body>
</html>
